# ============================================================================
#  Gran UI на macOS без своего Mac (план M1–M6, docs/roadmap.md): сборка clang'ом и проверки на раннере
#  GitHub Actions при каждом push и pull request.
#
#  Три задачи: ядро без окна ОС (Makefile, NATIVE=0) — модульные тесты, отчёт о сбое, шейдеры Metal;
#  окно Cocoa и Metal (Makefile и CMake, NATIVE=1 — умолчание с M6) — бэкенд, окно в процессе, снимки;
#  CMake — универсальная сборка x86_64 + arm64 с окном и Metal, тесты обеих архитектур (x86_64 — через Rosetta).
#  «Берёста» берётся из её публичного репозитория на закреплённом выпуске BERESTA_REF.
#  Используются только официальные действия GitHub (actions/*).
# ============================================================================
#  Gran UI on macOS without an own Mac (plan M1–M6, docs/roadmap.md): building with clang and the checks on a
#  GitHub Actions runner on every push and pull request.
#
#  Three jobs: the core without an OS window (Makefile, NATIVE=0) — the unit tests, the crash report, the Metal shaders;
#  the Cocoa window and Metal (Makefile and CMake, NATIVE=1 — the default since M6) — the backend, the in-process window,
#  the snapshots; CMake — a universal x86_64 + arm64 build with the window and Metal, the tests of both architectures
#  (x86_64 — through Rosetta).
#  Beresta is taken from its public repository at the pinned BERESTA_REF release.
#  Only the official GitHub actions (actions/*) are used.
# ============================================================================
name: macOS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон / A new push to the same branch cancels the outdated run
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

# Выпуск «Берёсты», с которым проверяется движок; меняется вместе с её обновлением на машине разработчика
# The Beresta release the engine is checked with; it changes together with its update on the developer machine
env:
  BERESTA_REF: v2.2.1
  # Общий журнал шагов задачи: при ошибке его строки уходят в аннотации (tools/ci/annotate_log.sh)
  # The common log of the job steps: on failure its lines go to annotations (tools/ci/annotate_log.sh)
  CI_LOG: ci.log

# bash у GitHub — это `bash -eo pipefail`: упавшая команда перед `| tee` роняет шаг
# GitHub's bash is `bash -eo pipefail`: a failed command before `| tee` fails the step
defaults:
  run:
    shell: bash

jobs:
  # ---- Ядро без окна (NATIVE=0): arm64, GNU make 4 из Homebrew (штатный make macOS — 3.81) ------
  # ---- The core without a window (NATIVE=0): arm64, GNU make 4 from Homebrew (the stock macOS make is 3.81) ------
  make:
    name: macOS arm64 core (Makefile, NATIVE=0)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: gran
      - uses: actions/checkout@v5
        with:
          repository: ErmaleyAlekov/beresta
          ref: ${{ env.BERESTA_REF }}
          path: beresta
      - name: GNU make 4 (gmake)
        run: |
          brew install make
          gmake --version | head -1
          clang++ --version | head -1
      - name: «Берёста» / Beresta (libberesta.a)
        timeout-minutes: 25
        run: gmake -C beresta -j"$(sysctl -n hw.ncpu)" bin/libberesta.a 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      - name: Ядро и тесты / The core and the tests
        timeout-minutes: 25
        working-directory: gran
        run: |
          { gmake NATIVE=0 BERESTA_DIR=../beresta platform
            gmake -j"$(sysctl -n hw.ncpu)" NATIVE=0 BERESTA_DIR=../beresta all
            gmake NATIVE=0 BERESTA_DIR=../beresta test; } 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      - name: Отчёт о сбое / The crash report (SIGSEGV, terminate, abort)
        timeout-minutes: 25
        working-directory: gran
        run: gmake NATIVE=0 BERESTA_DIR=../beresta test-crash 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      # Шейдеры Metal (M4): сгенерированный MSL → metallib компилятором Apple + раскладка структур против C++
      # The Metal shaders (M4): the generated MSL → a metallib by the Apple compiler + the struct layout against C++
      - name: Шейдеры Metal / Metal shaders (xcrun metal)
        timeout-minutes: 10
        working-directory: gran
        run: gmake NATIVE=0 BERESTA_DIR=../beresta metal-check 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      # Есть ли у раннера устройство Metal — от этого зависят снимки бэкенда Metal (M5); шаг только сообщает
      # Whether the runner has a Metal device — the Metal backend snapshots (M5) depend on it; the step only reports
      - name: Устройство Metal / Metal device probe
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Итог — в аннотацию ::notice: журнал задачи без входа в GitHub не читается
          # The result goes to a ::notice annotation: the job log cannot be read without signing in to GitHub
          # Ошибка любой части не роняет шаг: её текст тоже уходит в аннотацию
          # A failure of any part does not fail the step: its text goes to the annotation too
          set +e +o pipefail
          printf '%s\n' 'import Metal' 'if let d = MTLCreateSystemDefaultDevice() { print(d.name) } else { print("none") }' > "$RUNNER_TEMP/probe.swift"
          device=$(xcrun swift "$RUNNER_TEMP/probe.swift" 2>&1 | tail -3 | tr '\n' ' ')
          gpu=$(system_profiler SPDisplaysDataType 2>&1 | grep -E "Chipset Model|Metal|Cores" | tr -s ' ' | tr '\n' ';')
          echo "::notice title=Metal device::device=$device; $gpu"
      # Журнал — в аннотации (их видно без входа в GitHub), отчёты о сбое — в артефакт
      # The log goes to annotations (visible without signing in to GitHub), the crash reports — to an artifact
      - name: Журнал в аннотации / The log into annotations
        if: failure() || cancelled()
        run: bash gran/tools/ci/annotate_log.sh "$GITHUB_WORKSPACE/$CI_LOG" "macOS make"
      - name: Отчёты при ошибке / Reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-make-reports
          path: gran/bin/crash_check
          if-no-files-found: ignore

  # ---- Окно Cocoa и Metal (NATIVE=1, шаги M5, M6): бэкенд, окно в процессе, снимки против эталонов D3D12 WARP --------
  # ---- The Cocoa window and Metal (NATIVE=1, steps M5, M6): the backend, the in-process window, the snapshots against the D3D12 WARP baselines --------
  metal:
    name: macOS arm64 Metal + Cocoa (Makefile, NATIVE=1)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: gran
      - uses: actions/checkout@v5
        with:
          repository: ErmaleyAlekov/beresta
          ref: ${{ env.BERESTA_REF }}
          path: beresta
      - name: GNU make 4 (gmake)
        run: brew install make
      - name: «Берёста» / Beresta (libberesta.a)
        timeout-minutes: 25
        run: gmake -C beresta -j"$(sysctl -n hw.ncpu)" bin/libberesta.a 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      - name: Библиотека с Cocoa и Metal, примеры, тесты / The library with Cocoa and Metal, the examples, the tests
        timeout-minutes: 25
        working-directory: gran
        run: |
          { gmake NATIVE=1 BERESTA_DIR=../beresta platform
            gmake -j"$(sysctl -n hw.ncpu)" NATIVE=1 BERESTA_DIR=../beresta all
            gmake NATIVE=1 BERESTA_DIR=../beresta test
            ls -l bin/gran_gallery bin/gran_editor bin/gran_snapshot; } 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      # Отладочный слой Metal и проверка шейдеров включаются только переменными окружения процесса
      # The Metal debug layer and the shader validation are enabled only by the process environment variables
      # Окно Cocoa создаётся в сеансе рабочего стола раннера; ввод — через очередь AppKit, без прав «Универсального доступа»
      # The Cocoa window is created in the runner desktop session; the input goes through the AppKit queue, without the "Accessibility" rights
      - name: Бэкенд Metal, окно Cocoa и снимки / The Metal backend, the Cocoa window and the snapshots
        timeout-minutes: 15
        working-directory: gran
        env:
          MTL_DEBUG_LAYER: 1
          MTL_SHADER_VALIDATION: 1
        run: gmake NATIVE=1 BERESTA_DIR=../beresta test-render 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG" "$RUNNER_TEMP/render.log"
      # Итог снимков (пиксели, наибольшее отличие) — в аннотацию и при успехе: так допуск выбирается по фактам
      # The snapshot summary (pixels, the largest difference) goes to an annotation on success too: so the tolerance is chosen by facts
      - name: Снимки в аннотацию / The snapshots into an annotation
        if: always()
        run: |
          set +e +o pipefail
          summary=$(grep -E "^\[ OK \]|^\[FAIL\]|^Metal |^Cocoa |informational|^    \(" "$RUNNER_TEMP/render.log" 2>/dev/null | tr '\n' ';')
          echo "::notice title=Metal snapshots::$summary"
      # Тот же бэкенд через CMake: metallib, .mm с ARC, фреймворки, ctest с проверками Metal
      # The same backend through CMake: the metallib, .mm with ARC, the frameworks, ctest with the Metal checks
      - name: CMake + ctest (Metal)
        timeout-minutes: 25
        env:
          MTL_DEBUG_LAYER: 1
        run: |
          { cmake -S gran -B build-metal -DGRAN_NATIVE=ON -DGRAN_BUILD_RENDER_TESTS=ON -DGRAN_BERESTA_DIR="$GITHUB_WORKSPACE/beresta"
            cmake --build build-metal -j"$(sysctl -n hw.ncpu)"
            ctest --test-dir build-metal --output-on-failure; } 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      - name: Снимки Metal / Metal snapshots (PNG)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-metal-snapshots
          path: gran/scratchpad/render-tests
          if-no-files-found: ignore
      - name: Журнал в аннотации / The log into annotations
        if: failure() || cancelled()
        run: bash gran/tools/ci/annotate_log.sh "$GITHUB_WORKSPACE/$CI_LOG" "macOS Metal"

  # ---- CMake: универсальный бинарник x86_64 + arm64 (с M6 по умолчанию — с окном Cocoa и Metal) ------------
  # ---- CMake: the universal x86_64 + arm64 binary (since M6 by default — with the Cocoa window and Metal) ------------
  cmake:
    name: macOS universal (CMake)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: gran
      - uses: actions/checkout@v5
        with:
          repository: ErmaleyAlekov/beresta
          ref: ${{ env.BERESTA_REF }}
          path: beresta
      - name: CMake (universal)
        timeout-minutes: 25
        run: |
          { cmake -S gran -B build -DGRAN_BERESTA_DIR="$GITHUB_WORKSPACE/beresta" -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            cmake --build build -j"$(sysctl -n hw.ncpu)"
            lipo -info build/bin/gran_tests | grep 'x86_64 arm64'
            lipo -info build/bin/gran_gallery | grep 'x86_64 arm64'; } 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      - name: ctest (arm64)
        timeout-minutes: 25
        run: ctest --test-dir build --output-on-failure 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      # Тесты запускаются из корня исходников (пути schemas/, samples/), как в ctest
      # The tests run from the source root (the schemas/, samples/ paths), as in ctest
      - name: Тесты x86_64 через Rosetta / x86_64 tests through Rosetta
        timeout-minutes: 25
        working-directory: gran
        run: |
          { arch -x86_64 ../build/bin/gran_tests
            arch -x86_64 ../build/bin/gran_crash_probe --check ../build/crash-check-x86_64; } 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"
      - name: Журнал в аннотации / The log into annotations
        if: failure() || cancelled()
        run: bash gran/tools/ci/annotate_log.sh "$GITHUB_WORKSPACE/$CI_LOG" "macOS CMake"
      - name: Отчёты при ошибке / Reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-cmake-reports
          path: |
            build/crash-check
            build/crash-check-x86_64
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
